version: "3.8"

services:
  sites-template:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    command: npm run preview --workspace=template -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped
